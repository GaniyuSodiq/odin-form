<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="odin-hero">
        <div class="odin-logo">
            <img src="files/odin-lined.png" alt="odin logo">
            <h1>ODIN</h1>
        </div>
        <div class="footer">
            <span>
                Photo by <a href="https://unsplash.com/photos/25xggax4bSA">
                Halie West</a> on <a href="https://unsplash.com">Unsplash</a>
            </span>
        </div>
    </section>
    <section class="content">
        <div class="hero-text rhs">
            <p>This is not real online service. You know you need something like this 
                in your life to realize your deepest dreams. <br> Sign up <em>now</em>
                to get started.
            </p>
            <p>You <em>know</em> you want to.</p>
        </div>
        <div class="form-section">
            <div class="rhs">
                <h3>Let's do this!</h3>
                <form action="" method="">
                    <div class="names">
                        <div>
                            <label for="fname">First name: </label>
                            <input type="text" id="fname" name="first-name" required>
                        </div>
                        <div>
                            <label for="lname">Last name: </label>
                            <input type="text"  id="lname" name="last-name" required>
                        </div>
                    </div>
                    <div class="contact">
                        <div>
                            <label for="email">Email: </label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div>
                            <label for="phone">Phone number: </label>
                            <input type="tel" id="phone" name="phone">
                        </div>
                    </div>
                    <div class="password">
                        <div>
                            <label for="pwd">Password: </label>
                            <input type="password" id="pwd" name="password" required>
                        </div>
                        <div>
                            <label for="confirm-pwd">Confirm password: </label>
                            <input type="password" id="confirm-pwd" name="confirm-password" required>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="button-section rhs">
            <button>Submit</button>
            <p>Already have an account? <span>Log in</span></p>
        </div>
    </section>
</body>
</html>
